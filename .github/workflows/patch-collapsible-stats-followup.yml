name: One-time collapsible statistics follow-up

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-collapsible-stats-followup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep cloud controls visible and align KPI tests
        shell: python
        run: |
          from pathlib import Path

          metrics = Path("src/football/source-comparison-metrics.js")
          source = metrics.read_text(encoding="utf-8")

          marker = '''/**
           * 建立並維持統計收合容器。
           * 時間複雜度：O(1)
           * 空間複雜度：O(1)
           *
           * 更快替代方案比較：
           * - 每次 renderRecords 重建整個收合區，會造成額外 DOM 配置與畫面跳動。
           * - 本版容器只建立一次，後續只把既有 KPI 與比較面板移入固定內容區。
           */
          function ensureStatsAccordion() {'''
          helper = '''/**
           * 雲端同步屬於操作功能，不是統計資料；即使統計收合也必須保持可見。
           * 時間複雜度：O(1)
           * 空間複雜度：O(1)
           *
           * 更快替代方案比較：
           * - 每次掃描收合區所有子節點會增加不必要遍歷。
           * - 本版以固定 ID 直接查找並搬回收合區外，維持常數成本。
           */
          function keepOperationalPanelsVisible(details) {
            const cloudPanel = byId("football-cloud-panel");
            const content = byId(STATS_ACCORDION_CONTENT_ID);
            const recordsContainer = details?.parentElement;
            if (!cloudPanel || !content || !recordsContainer || !content.contains(cloudPanel)) return;
            recordsContainer.insertBefore(cloudPanel, details);
          }

          /**
           * 建立並維持統計收合容器。
           * 時間複雜度：O(1)
           * 空間複雜度：O(1)
           *
           * 更快替代方案比較：
           * - 每次 renderRecords 重建整個收合區，會造成額外 DOM 配置與畫面跳動。
           * - 本版容器只建立一次，後續只把既有 KPI 與比較面板移入固定內容區。
           */
          function ensureStatsAccordion() {'''
          if marker not in source:
              raise SystemExit("Stats accordion marker not found")
          source = source.replace(marker, helper, 1)

          old_return = '''  const comparison = byId("football-source-comparison");
            if (comparison && comparison.parentElement !== content) {
              content.insertBefore(comparison, kpis);
            }

            return details;
          }'''
          new_return = '''  const comparison = byId("football-source-comparison");
            if (comparison && comparison.parentElement !== content) {
              content.insertBefore(comparison, kpis);
            }

            keepOperationalPanelsVisible(details);
            return details;
          }'''
          if old_return not in source:
              raise SystemExit("Stats accordion return block not found")
          source = source.replace(old_return, new_return, 1)

          old_observer = '''  observer = new MutationObserver(() => {
              const panel = byId("football-source-comparison");
              if (!panel || rendering) return;
              if (panel.textContent.includes("單張賽果") || !panel.textContent.includes("單張能量")) {
                window.queueMicrotask(renderSourceComparison);
              }
            });'''
          new_observer = '''  observer = new MutationObserver(() => {
              const details = byId(STATS_ACCORDION_ID);
              keepOperationalPanelsVisible(details);
              const panel = byId("football-source-comparison");
              if (!panel || rendering) return;
              if (panel.textContent.includes("單張賽果") || !panel.textContent.includes("單張能量")) {
                window.queueMicrotask(renderSourceComparison);
              }
            });'''
          if old_observer not in source:
              raise SystemExit("Stats mutation observer block not found")
          metrics.write_text(source.replace(old_observer, new_observer, 1), encoding="utf-8")

          for test_path in (
              Path("tests/e2e/football-kpi-density.spec.js"),
              Path("tests/e2e/football-performance-clarity.spec.js"),
          ):
              test_source = test_path.read_text(encoding="utf-8")
              old = '''  await expect.poll(() => page.locator("#football-kpis > .football-kpi").count()).toBeGreaterThanOrEqual(7);
            await expect(page.locator("#football-kpis .football-kpi-readable-label").first()).toBeVisible();'''
              new = '''  await expect.poll(() => page.locator("#football-kpis > .football-kpi").count()).toBeGreaterThanOrEqual(7);
            await page.locator("#football-stats-accordion > summary").click();
            await expect(page.locator("#football-kpis .football-kpi-readable-label").first()).toBeVisible();'''
              if old not in test_source:
                  raise SystemExit(f"KPI visibility block not found: {test_path}")
              test_path.write_text(test_source.replace(old, new, 1), encoding="utf-8")

      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/football/source-comparison-metrics.js tests/e2e/football-kpi-density.spec.js tests/e2e/football-performance-clarity.spec.js
          git commit -m "fix: keep sync controls outside collapsed statistics"
          git push origin HEAD:main
