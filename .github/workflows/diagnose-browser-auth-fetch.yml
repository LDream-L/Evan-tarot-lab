name: Diagnose browser auth fetch

on:
  push:
    paths:
      - .github/workflows/diagnose-browser-auth-fetch.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Probe from deployed GitHub Pages in Chromium
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            page.on('console', msg => console.log('[console]', msg.type(), msg.text()));
            page.on('pageerror', err => console.log('[pageerror]', err.message));
            page.on('requestfailed', req => {
              if (/script\.google|googleusercontent|oauth2\.googleapis/.test(req.url())) {
                console.log('[requestfailed]', req.method(), req.url(), req.failure()?.errorText);
              }
            });
            await page.goto('https://ldream-l.github.io/Evan-tarot-lab/football-lab.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
            console.log('page=', page.url());
            const result = await page.evaluate(async () => {
              const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbzswz6AgA2DnXKNVwfSgCHBUwgiqZCT6w8McUVw8EOCBxvnPb2--SxAZJelKsakdbrv/exec';
              const credential = ['header', 'eyJzdWIiOiJkaWFnbm9zdGljIiwiZXhwIjo0MTAyNDQ0ODAwfQ', 'signature'].join('.');
              const runFetch = async (url, options, timeoutMs = 15000) => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                const started = performance.now();
                try {
                  const response = await fetch(url, { ...options, signal: controller.signal });
                  const text = await response.text();
                  return {
                    ok: response.ok,
                    status: response.status,
                    type: response.type,
                    finalUrl: response.url,
                    elapsedMs: Math.round(performance.now() - started),
                    text,
                  };
                } catch (error) {
                  return {
                    errorName: error?.name || '',
                    errorMessage: error?.message || String(error),
                    elapsedMs: Math.round(performance.now() - started),
                  };
                } finally {
                  clearTimeout(timer);
                }
              };
              const appsScript = await runFetch(appsScriptUrl, {
                method: 'POST',
                cache: 'no-store',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                body: JSON.stringify({
                  action: 'authStatus',
                  credential,
                  requestId: 'browser_diagnostic',
                  website: '',
                }),
              });
              const tokenInfo = await runFetch('https://oauth2.googleapis.com/tokeninfo', {
                method: 'GET',
                cache: 'no-store',
                mode: 'cors',
              });
              return { appsScript, tokenInfo };
            });
            console.log('RESULT', JSON.stringify(result, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
