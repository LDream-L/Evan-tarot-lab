name: Format Timeflow CSS Source

on:
  push:
    branches:
      - refactor/site-architecture-20260712
    paths:
      - timeflow.css
      - scripts/format-timeflow-css.cjs
      - .github/workflows/format-timeflow-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/site-architecture-20260712

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate readable source
        run: node scripts/format-timeflow-css.cjs

      - name: Commit generated source
        run: |
          if git diff --quiet -- src/styles/timeflow.css; then
            echo "Readable source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/timeflow.css
          git commit -m "chore: 產生可讀的時間流 CSS 來源"
          git push origin HEAD:refactor/site-architecture-20260712
