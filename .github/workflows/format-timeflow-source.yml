name: Build Timeflow CSS Source Artifact

on:
  pull_request:
    paths:
      - timeflow.css
      - scripts/format-timeflow-css.cjs
      - .github/workflows/format-timeflow-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate readable source
        run: node scripts/format-timeflow-css.cjs

      - name: Verify generated CSS is non-empty
        run: test -s src/styles/timeflow.css

      - name: Upload readable source
        uses: actions/upload-artifact@v4
        with:
          name: timeflow-readable-source
          path: src/styles/timeflow.css
          if-no-files-found: error
          retention-days: 3
