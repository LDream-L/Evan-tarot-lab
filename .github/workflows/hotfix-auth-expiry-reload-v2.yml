name: One-time auth expiry reload hotfix v2

on:
  push:
    paths:
      - .github/workflows/hotfix-auth-expiry-reload-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Google auth expiry and cloud rejection handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          VERSION = '20260810-auth-expiry-reload-v1'

          auth_path = Path('JS/google-auth.js')
          text = auth_path.read_text(encoding='utf-8')
          const_marker = '  const CREDENTIAL_STORAGE_KEY = "evanGoogleIdToken";\n'
          if 'EXPIRY_SAFETY_MS' not in text:
              if const_marker not in text:
                  raise SystemExit('google-auth credential constant marker not found')
              text = text.replace(
                  const_marker,
                  const_marker + '  const EXPIRY_SAFETY_MS = 5000;\n  const MAX_TIMER_MS = 2147483647;\n',
                  1,
              )
          state_marker = '  let authError = "";\n'
          if 'credentialExpiresAt' not in text:
              if state_marker not in text:
                  raise SystemExit('google-auth state marker not found')
              text = text.replace(
                  state_marker,
                  state_marker + '  let credentialExpiresAt = 0;\n  let expiryTimer = 0;\n  let reloadScheduled = false;\n  let lifecycleBound = false;\n',
                  1,
              )

          freshness = '''  function isCredentialFresh(payload) {\n    if (!payload?.sub) return false;\n    const expiresAt = Number(payload.exp || 0) * 1000;\n    return !expiresAt || expiresAt > Date.now() + 30000;\n  }\n'''
          helpers = freshness + '''\n  /** 清除單一到期計時器：時間／空間 O(1)。 */\n  function clearCredentialExpiryTimer() {\n    if (expiryTimer) window.clearTimeout(expiryTimer);\n    expiryTimer = 0;\n  }\n\n  /**\n   * 登出後只排一次重新整理：時間／空間 O(1)。\n   * 更快替代方案比較：每個 auth listener 各自 reload 會造成重複導頁；集中在登入核心只需一次狀態切換。\n   */\n  function schedulePageReload() {\n    if (reloadScheduled) return;\n    reloadScheduled = true;\n    window.setTimeout(() => window.location.reload(), 0);\n  }\n\n  /**\n   * 清除工作階段；時間／空間 O(1)。\n   * reload=true 時先清除 storage 再重整，避免重新載入時再次拿到同一枚過期 Token。\n   */\n  function clearSession({ message = "", reload = false } = {}) {\n    clearCredentialExpiryTimer();\n    credentialExpiresAt = 0;\n    credential = "";\n    user = null;\n    nickname = "";\n    profileLoading = false;\n    authVerifying = false;\n    authError = message;\n    sessionStorage.removeItem(CREDENTIAL_STORAGE_KEY);\n    sessionStorage.removeItem("evanFootballGoogleIdToken");\n    window.google?.accounts?.id?.disableAutoSelect?.();\n    setText("google-nickname-status", "");\n    updateUI();\n    notify();\n    renderButton();\n    if (reload) schedulePageReload();\n  }\n\n  /**\n   * 主動檢查目前 Token 是否到期：時間／空間 O(1)。\n   * 更快替代方案比較：固定每秒輪詢會持續喚醒頁面；只在到期 timer 與頁面重新可見／聚焦時檢查即可。\n   */\n  function checkCredentialExpiry() {\n    if (!credential || !user || !credentialExpiresAt) return false;\n    if (credentialExpiresAt > Date.now() + EXPIRY_SAFETY_MS) return false;\n    expireSession("Google 登入已過期，頁面將重新整理。");\n    return true;\n  }\n\n  /**\n   * 依 JWT exp 排程一次到期處理：時間／空間 O(1)。\n   * Safari 背景頁可能暫停 timer，因此另由 lifecycle 事件補檢查。\n   */\n  function scheduleCredentialExpiry(payload) {\n    clearCredentialExpiryTimer();\n    credentialExpiresAt = Number(payload?.exp || 0) * 1000;\n    if (!credentialExpiresAt) return;\n    const delay = credentialExpiresAt - Date.now() - EXPIRY_SAFETY_MS;\n    if (delay <= 0) {\n      window.queueMicrotask(checkCredentialExpiry);\n      return;\n    }\n    expiryTimer = window.setTimeout(checkCredentialExpiry, Math.min(delay, MAX_TIMER_MS));\n  }\n\n  /** lifecycle 事件固定三個：時間／空間 O(1)。 */\n  function bindCredentialLifecycle() {\n    if (lifecycleBound) return;\n    lifecycleBound = true;\n    document.addEventListener("visibilitychange", () => {\n      if (document.visibilityState === "visible") checkCredentialExpiry();\n    });\n    window.addEventListener("focus", checkCredentialExpiry, { passive: true });\n    window.addEventListener("pageshow", checkCredentialExpiry, { passive: true });\n  }\n\n  /** 後端或到期計時器可共用的失效入口：時間／空間 O(1)。 */\n  function expireSession(message = "Google 登入已過期，頁面將重新整理。") {\n    clearSession({ message, reload: true });\n  }\n'''
          if 'function clearCredentialExpiryTimer()' not in text:
              if freshness not in text:
                  raise SystemExit('google-auth freshness marker not found')
              text = text.replace(freshness, helpers, 1)

          success_old = '''      credential = nextCredential;\n      user = nextUser;\n      if (persist) sessionStorage.setItem(CREDENTIAL_STORAGE_KEY, nextCredential);\n      authVerifying = false;\n'''
          success_new = '''      credential = nextCredential;\n      user = nextUser;\n      scheduleCredentialExpiry(payload);\n      if (persist) sessionStorage.setItem(CREDENTIAL_STORAGE_KEY, nextCredential);\n      authVerifying = false;\n'''
          if 'scheduleCredentialExpiry(payload);' not in text:
              if success_old not in text:
                  raise SystemExit('google-auth credential success marker not found')
              text = text.replace(success_old, success_new, 1)

          catch_old = '''      sessionStorage.removeItem(CREDENTIAL_STORAGE_KEY);\n      credential = "";\n      user = null;\n      nickname = "";\n      authVerifying = false;\n'''
          catch_new = '''      clearCredentialExpiryTimer();\n      credentialExpiresAt = 0;\n      sessionStorage.removeItem(CREDENTIAL_STORAGE_KEY);\n      credential = "";\n      user = null;\n      nickname = "";\n      authVerifying = false;\n'''
          if 'credentialExpiresAt = 0;\n      sessionStorage.removeItem(CREDENTIAL_STORAGE_KEY);' not in text:
              if catch_old not in text:
                  raise SystemExit('google-auth verification catch marker not found')
              text = text.replace(catch_old, catch_new, 1)

          init_old = '''    initialized = true;\n    updateUI();\n    document.getElementById("google-signout-button")?.addEventListener("click", signOut);\n'''
          init_new = '''    initialized = true;\n    updateUI();\n    bindCredentialLifecycle();\n    document.getElementById("google-signout-button")?.addEventListener("click", signOut);\n'''
          if 'bindCredentialLifecycle();' not in text.split('async function init()', 1)[-1]:
              if init_old not in text:
                  raise SystemExit('google-auth init marker not found')
              text = text.replace(init_old, init_new, 1)

          old_signout = '''  function signOut() {\n    credential = "";\n    user = null;\n    nickname = "";\n    profileLoading = false;\n    authVerifying = false;\n    authError = "";\n    sessionStorage.removeItem(CREDENTIAL_STORAGE_KEY);\n    sessionStorage.removeItem("evanFootballGoogleIdToken");\n    window.google?.accounts?.id?.disableAutoSelect?.();\n    setText("google-nickname-status", "");\n    updateUI();\n    notify();\n    renderButton();\n  }\n'''
          new_signout = '''  /**\n   * 登出後重新整理頁面；時間／空間 O(1)。\n   * click event 直接傳入時沒有 reload=false，因此手動登出同樣會重整。\n   */\n  function signOut(options = {}) {\n    const shouldReload = options?.reload !== false;\n    clearSession({ message: "", reload: shouldReload });\n  }\n'''
          if 'function signOut(options = {})' not in text:
              if old_signout not in text:
                  raise SystemExit('google-auth signOut block not found')
              text = text.replace(old_signout, new_signout, 1)

          public_old = '''    signOut,\n    saveNickname,\n    getCredential: () => credential,\n'''
          public_new = '''    signOut,\n    expireSession,\n    checkCredentialExpiry,\n    saveNickname,\n    getCredential: () => credential,\n'''
          if '    expireSession,\n    checkCredentialExpiry,' not in text:
              if public_old not in text:
                  raise SystemExit('google-auth public API marker not found')
              text = text.replace(public_old, public_new, 1)
          auth_path.write_text(text, encoding='utf-8')

          cloud_path = Path('src/football/cloud.js')
          text = cloud_path.read_text(encoding='utf-8')
          protocol_marker = 'const CONFIRMED_ACTIONS = Object.freeze(["health", "createRecord", "updateActual"]);\n'
          protocol_add = protocol_marker + '''const AUTH_FAILURE_PATTERN = /Google\\s*登入.*(?:憑證|資料).*(?:驗證失敗|無效|過期)|(?:憑證|登入資料).*(?:驗證失敗|無效|過期)/i;\n\n/**\n * 只辨識後端已明確回報的登入失效訊息：時間 O(m)、空間 O(1)，m 為錯誤文字長度。\n * 更快替代方案比較：所有 4xx 都強制登出雖是 O(1) 判斷，但會把資料格式或權限錯誤誤判成登入過期；\n * 本版只比對 auth 關鍵語意，避免不必要的重新整理。\n */\nexport function isCloudAuthFailure(error) {\n  return AUTH_FAILURE_PATTERN.test(String(error?.message || error || ""));\n}\n'''
          if 'export function isCloudAuthFailure' not in text:
              if protocol_marker not in text:
                  raise SystemExit('cloud protocol marker not found')
              text = text.replace(protocol_marker, protocol_add, 1)

          request_old = '''    const response = await fetchImpl(apiUrl, {\n      method: "POST",\n      headers: { "Content-Type": "text/plain;charset=utf-8" },\n      body: JSON.stringify({ action, idToken, ...payload }),\n      redirect: "follow",\n    });\n    return parseCloudResponse(response);\n'''
          request_new = '''    const response = await fetchImpl(apiUrl, {\n      method: "POST",\n      headers: { "Content-Type": "text/plain;charset=utf-8" },\n      body: JSON.stringify({ action, idToken, ...payload }),\n      redirect: "follow",\n    });\n    try {\n      return await parseCloudResponse(response);\n    } catch (error) {\n      if (isCloudAuthFailure(error)) {\n        const auth = getAuth();\n        if (typeof auth?.expireSession === "function") {\n          auth.expireSession("Google 登入已失效，頁面將重新整理。");\n        } else {\n          auth?.signOut?.();\n        }\n      }\n      throw error;\n    }\n'''
          if 'auth.expireSession("Google 登入已失效' not in text:
              if request_old not in text:
                  raise SystemExit('cloud request marker not found')
              text = text.replace(request_old, request_new, 1)
          cloud_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/football-cloud-module.test.cjs')
          text = test_path.read_text(encoding='utf-8')
          if 'let expired = 0;' not in text:
              text = text.replace('    let signedOut = 0;\n', '    let signedOut = 0;\n    let expired = 0;\n    let rejectAuth = false;\n', 1)
          fetch_old = '''      const body = JSON.parse(options.body);\n      return makeResponse({\n        ok: true,\n        result: { action: body.action, id: body.recordId || body.record?.id },\n      });\n'''
          fetch_new = '''      const body = JSON.parse(options.body);\n      if (rejectAuth) {\n        return makeResponse(\n          { ok: false, error: "Google 登入憑證驗證失敗。" },\n          { ok: false, status: 401 }\n        );\n      }\n      return makeResponse({\n        ok: true,\n        result: { action: body.action, id: body.recordId || body.record?.id },\n      });\n'''
          if 'if (rejectAuth)' not in text:
              if fetch_old not in text:
                  raise SystemExit('cloud test fetch marker not found')
              text = text.replace(fetch_old, fetch_new, 1)
          auth_old = '''      getCredential: () => "jwt-token",\n      signOut: () => { signedOut += 1; },\n      onChange(listener) {\n'''
          auth_new = '''      getCredential: () => "jwt-token",\n      signOut: () => { signedOut += 1; },\n      expireSession: () => { expired += 1; },\n      onChange(listener) {\n'''
          if 'expireSession: () => { expired += 1; }' not in text:
              if auth_old not in text:
                  raise SystemExit('cloud test auth marker not found')
              text = text.replace(auth_old, auth_new, 1)
          insertion = '''    assert.equal(await cloud.healthCheck(), true);\n    assert.match(calls.at(-1).url, /action=health/);\n\n'''
          extra_test = insertion + '''    rejectAuth = true;\n    await assert.rejects(() => cloud.saveRecord(records[0]), /Google 登入憑證驗證失敗/);\n    assert.equal(expired, 1);\n    assert.equal(signedOut, 0);\n    rejectAuth = false;\n\n'''
          if 'assert.equal(expired, 1);' not in text:
              if insertion not in text:
                  raise SystemExit('cloud test insert marker not found')
              text = text.replace(insertion, extra_test, 1)
          test_path.write_text(text, encoding='utf-8')

          replacements = {
              Path('JS/site-account.js'): [
                  ('const SCRIPT_VERSION = "20260714-account-layout-v1";', f'const SCRIPT_VERSION = "{VERSION}";'),
              ],
              Path('JS/main.js'): [
                  ('JS/site-account.js?v=20260714-account-layout-v1', f'JS/site-account.js?v={VERSION}'),
              ],
              Path('JS/football-lab.js'): [
                  ('20260808-ipad-layout-v2', VERSION),
              ],
              Path('football-lab.html'): [
                  ('JS/football-lab.js?v=20260808-ipad-layout-v2', f'JS/football-lab.js?v={VERSION}'),
                  ('JS/main.js?v=20260714-account-layout-v1', f'JS/main.js?v={VERSION}'),
              ],
              Path('tests/football-bundle.test.cjs'): [
                  ('const FOOTBALL_SCRIPT_VERSION = "20260808-ipad-layout-v2";', f'const FOOTBALL_SCRIPT_VERSION = "{VERSION}";'),
              ],
          }
          for path, pairs in replacements.items():
              content = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in content:
                      content = content.replace(old, new, 1)
                  elif new not in content:
                      raise SystemExit(f'missing version marker in {path}: {old}')
              path.write_text(content, encoding='utf-8')
          PY
      - name: Run targeted checks
        shell: bash
        run: |
          set -euo pipefail
          node --check JS/google-auth.js
          node --check JS/site-account.js
          node --check JS/main.js
          node --check src/football/cloud.js
          npm install --no-audit --no-fund
          node tests/football-cloud-module.test.cjs
          node scripts/build-site.cjs
          node tests/football-bundle.test.cjs
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JS/google-auth.js JS/site-account.js JS/main.js JS/football-lab.js football-lab.html src/football/cloud.js tests/football-cloud-module.test.cjs tests/football-bundle.test.cjs
          git commit -m "fix: reload when Google session expires"
          git push origin main
