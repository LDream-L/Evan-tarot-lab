name: Actions Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-smoke-test.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write marker
        run: |
          echo "actions-ok" > actions-smoke-test.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add actions-smoke-test.txt
          git commit -m 'chore: verify GitHub Actions write access'
          git push
