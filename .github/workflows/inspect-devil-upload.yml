name: Inspect Devil Upload Chunk

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-devil-upload.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing upload data
        shell: bash
        run: |
          set -u
          SRC='assets/article-media/devil-hq-upload/chunk_000.txt'
          OUT='/tmp/devil.webp'
          REPORT='assets/article-media/devil-upload-inspection.txt'
          set +e
          tr -d '\n\r ' < "$SRC" | base64 --decode > "$OUT"
          STATUS=$?
          set -e
          {
            echo "text_size=$(stat -c%s "$SRC")"
            echo "text_sha256=$(sha256sum "$SRC" | awk '{print $1}')"
            echo "decode_status=$STATUS"
            echo "binary_size=$(stat -c%s "$OUT")"
            echo "binary_sha256=$(sha256sum "$OUT" | awk '{print $1}')"
            echo "file_type=$(file -b "$OUT")"
          } > "$REPORT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'chore: inspect Devil upload payload'
          git push
