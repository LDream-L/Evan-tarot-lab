name: One-time profit stats sections upgrade

on:
  push:
    paths:
      - .github/workflows/hotfix-profit-stats-sections.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add period betting P&L and nested statistic sections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = "20260812-profit-stats-sections-v1"

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          # 1) Betting summary: retain settled cost in the same O(b) pass.
          path = Path("src/football/betting-model.js")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "  let actualProfit = 0;\n  let won = 0;",
              "  let actualProfit = 0;\n  let settledStake = 0;\n  let won = 0;",
              "bet settledStake declaration",
          )
          text = replace_once(
              text,
              '''  for (let index = 0; index < source.length; index += 1) {\n    const bet = source[index];\n    totalStake += Number(bet.stake) || 0;\n    potentialProfit += calculatePotentialProfit(bet.stake, bet.odds) || 0;\n    const settlement = settleBet(bet, actual);\n    if (settlement.status === "won" || settlement.status === "lost" || settlement.status === "void") {\n      settled += 1;\n      actualProfit += Number(settlement.profit) || 0;\n''',
              '''  for (let index = 0; index < source.length; index += 1) {\n    const bet = source[index];\n    const stake = Number(bet.stake) || 0;\n    totalStake += stake;\n    potentialProfit += calculatePotentialProfit(stake, bet.odds) || 0;\n    const settlement = settleBet(bet, actual);\n    if (settlement.status === "won" || settlement.status === "lost" || settlement.status === "void") {\n      settled += 1;\n      settledStake += stake;\n      actualProfit += Number(settlement.profit) || 0;\n''',
              "single pass settled stake",
          )
          text = replace_once(
              text,
              "    actualProfit: roundMoney(actualProfit),\n    settled,",
              "    actualProfit: roundMoney(actualProfit),\n    settledStake: roundMoney(settledStake),\n    settled,",
              "return settledStake",
          )
          path.write_text(text, encoding="utf-8")

          # 2) Unit test settled cost.
          path = Path("tests/football-betting-model.test.cjs")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "  assert.equal(summary.totalStake, 700);\n  assert.equal(summary.actualProfit, 1775);",
              "  assert.equal(summary.totalStake, 700);\n  assert.equal(summary.settledStake, 700);\n  assert.equal(summary.actualProfit, 1775);",
              "betting model settledStake assertion",
          )
          path.write_text(text, encoding="utf-8")

          # 3) Rolling performance: add betting prefix metrics and make the whole section independently collapsible.
          path = Path("JS/football-performance-trends.js")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "// - buildIndexes：O(r * m) 時間／O(r * m) 空間，r 為紀錄數、m 為固定統計欄位數。",
              "// - buildIndexes：O(r * m + B) 時間／O(r * m) 空間，r 為紀錄數、m 為固定統計欄位數、B 為期間內投注總筆數。",
              1,
          )
          text = replace_once(
              text,
              '''    "advanceEligible",\n    "advanceHits",\n  ]);\n''',
              '''    "advanceEligible",\n    "advanceHits",\n    "betCount",\n    "betStake",\n    "betProfit",\n    "manualBetCount",\n    "manualBetStake",\n    "manualBetProfit",\n    "randomBetCount",\n    "randomBetStake",\n    "randomBetProfit",\n  ]);\n  const SIGNED_METRIC_KEYS = new Set(["betProfit", "manualBetProfit", "randomBetProfit"]);\n''',
              "performance betting metric keys",
          )
          text = replace_once(
              text,
              "/** 單筆只建立固定欄位貢獻：O(1) 時間／O(1) 空間。 */\n  function recordContribution(record) {",
              '''/**\n   * 單筆建立固定欄位與該筆投注貢獻。\n   * 時間複雜度：O(b)，b 為該紀錄投注筆數。\n   * 空間複雜度：O(1)。\n   * 更快替代方案比較：另外逐筆重掃歷史投注會使每次切換區間回到 O(r+B)；\n   * 本版在建立前綴表時只結算一次，後續區間查詢仍維持 O(log r + m)。\n   */\n  function recordContribution(record) {''',
              "recordContribution complexity",
          )
          text = replace_once(
              text,
              '''    out.completed = 1;\n    if (evaluation.type === "legacy5") return out;\n''',
              '''    out.completed = 1;\n\n    const bets = Array.isArray(record?.prediction?.bets) ? record.prediction.bets : [];\n    if (record.actual && bets.length && typeof core.summarizeBets === "function") {\n      const betting = core.summarizeBets(bets, record.actual);\n      const settledCount = Number(betting.settled || 0);\n      const settledStake = Number(betting.settledStake ?? betting.totalStake ?? 0);\n      const actualProfit = Number(betting.actualProfit || 0);\n      out.betCount = settledCount;\n      out.betStake = settledStake;\n      out.betProfit = actualProfit;\n\n      if (record.match?.cardSource === "manual") {\n        out.manualBetCount = settledCount;\n        out.manualBetStake = settledStake;\n        out.manualBetProfit = actualProfit;\n      } else if (record.match?.cardSource === "random") {\n        out.randomBetCount = settledCount;\n        out.randomBetStake = settledStake;\n        out.randomBetProfit = actualProfit;\n      }\n    }\n\n    if (evaluation.type === "legacy5") return out;\n''',
              "recordContribution betting aggregation",
          )
          text = text.replace(
              "/** 建立固定欄位前綴表：O(r * m) 時間／O(r * m) 空間。 */",
              "/** 建立固定欄位前綴表：O(r * m + B) 時間／O(r * m) 空間，B 為投注總筆數。 */",
              1,
          )
          text = text.replace(
              "/** 只在資料有變動時重建：O(r * m) 時間／O(r * m) 空間。 */",
              "/** 只在資料有變動時重建：O(r * m + B) 時間／O(r * m) 空間。 */",
              1,
          )
          text = replace_once(
              text,
              '''  function subtractVectors(source, removed) {\n    const result = emptyVector();\n    METRIC_KEYS.forEach((key) => {\n      result[key] = Math.max(0, source[key] - removed[key]);\n    });\n    return result;\n  }\n''',
              '''  /**\n   * 向量相減：時間 O(m)、空間 O(m)。損益允許負值，其餘計數欄位避免浮點誤差落到負數。\n   */\n  function subtractVectors(source, removed) {\n    const result = emptyVector();\n    METRIC_KEYS.forEach((key) => {\n      const difference = source[key] - removed[key];\n      result[key] = SIGNED_METRIC_KEYS.has(key) ? difference : Math.max(0, difference);\n    });\n    return result;\n  }\n''',
              "signed vector subtraction",
          )
          text = replace_once(
              text,
              '''  function formatNumber(value, digits = 2) {\n    if (!Number.isFinite(value)) return "—";\n    return String(Math.round(value * 10 ** digits) / 10 ** digits);\n  }\n\n''',
              '''  function formatNumber(value, digits = 2) {\n    if (!Number.isFinite(value)) return "—";\n    return String(Math.round(value * 10 ** digits) / 10 ** digits);\n  }\n\n  /** 金額格式：時間／空間 O(1)，損益不包含本金。 */\n  function formatMoney(value, signed = false) {\n    const number = Number(value);\n    if (!Number.isFinite(number)) return "—";\n    const normalized = Math.round((number + Number.EPSILON) * 100) / 100;\n    const prefix = signed && normalized > 0 ? "+" : "";\n    return `${prefix}$${normalized.toLocaleString("zh-TW", { maximumFractionDigits: 2 })}`;\n  }\n\n  /** ROI = 淨損益／已結算成本：時間／空間 O(1)。 */\n  function formatRoi(profit, stake) {\n    const cost = Number(stake);\n    if (!Number.isFinite(cost) || cost <= 0) return "—";\n    const value = (Number(profit) / cost) * 100;\n    return `${value > 0 ? "+" : ""}${formatNumber(value, 1)}%`;\n  }\n\n''',
              "money and ROI helpers",
          )

          betting_helpers = '''\n  /** 固定建立三張期間投注卡：時間／DOM 空間 O(1)。 */\n  function createBettingPerformanceCard(scope, label) {\n    const card = createElement("article", "football-trend-betting-card");\n    card.dataset.bettingScope = scope;\n    card.append(\n      createElement("small", "", label),\n      createElement("strong", "", "—"),\n      createElement("span", "", "此期間尚無已結算投注")\n    );\n    return card;\n  }\n\n  /** 固定三組牌源損益：時間／DOM 空間 O(1)。 */\n  function ensureBettingPerformanceSummary() {\n    let block = byId("football-trend-betting-block");\n    if (block) return block;\n    const body = byId("football-performance-body");\n    const periodSummary = byId("football-trend-summary");\n    if (!body || !periodSummary) return null;\n\n    block = createElement("section", "football-trend-betting-block");\n    block.id = "football-trend-betting-block";\n    const heading = createElement("div", "football-trend-betting-heading");\n    heading.append(\n      createElement("h4", "", "運彩期間損益"),\n      createElement("p", "", "依目前觀察區間累計；總損益與 ROI 都不把本金當成獲利。")\n    );\n    const grid = createElement("div", "football-trend-betting-grid");\n    grid.id = "football-trend-betting-summary";\n    grid.append(\n      createBettingPerformanceCard("all", "全部投注｜總損益"),\n      createBettingPerformanceCard("manual", "自己抽牌｜總損益"),\n      createBettingPerformanceCard("random", "網站隨機抽牌｜總損益")\n    );\n    block.append(heading, grid);\n    periodSummary.insertAdjacentElement("afterend", block);\n    return block;\n  }\n\n  /**\n   * 以目前時間視窗更新總成本、總損益與 ROI。\n   * 時間複雜度：O(1)，前綴查詢已在 resolveWindow 完成。\n   * DOM 空間複雜度：O(1)。\n   * 更快替代方案比較：每次切日期重新掃全部投注為 O(r+B)；本版只讀前綴向量的固定 9 個數值。\n   */\n  function renderBettingPerformance(windowState) {\n    if (!ensureBettingPerformanceSummary()) return;\n    const vector = windowState.current;\n    const scopes = [\n      ["all", vector.betCount, vector.betStake, vector.betProfit],\n      ["manual", vector.manualBetCount, vector.manualBetStake, vector.manualBetProfit],\n      ["random", vector.randomBetCount, vector.randomBetStake, vector.randomBetProfit],\n    ];\n\n    scopes.forEach(([scope, count, stake, profit]) => {\n      const card = document.querySelector(`[data-betting-scope="${scope}"]`);\n      if (!card) return;\n      const strong = card.querySelector(":scope > strong");\n      const detail = card.querySelector(":scope > span");\n      if (Number(count) <= 0) {\n        if (strong) strong.textContent = "—";\n        if (detail) detail.textContent = "此期間尚無已結算投注";\n        return;\n      }\n      if (strong) strong.textContent = formatMoney(profit, true);\n      if (detail) {\n        detail.textContent = `總成本 ${formatMoney(stake)}｜已結算 ${Number(count)} 筆｜ROI ${formatRoi(profit, stake)}`;\n      }\n    });\n  }\n\n'''
          anchor = "  /** 固定 KPI 卡數，直接更新現有卡片：O(k) 時間／O(1) 額外空間。 */\n"
          text = replace_once(text, anchor, betting_helpers + anchor, "betting performance render helpers")
          text = replace_once(
              text,
              '''    const windowState = resolveWindow();\n    Array.from(grid.querySelectorAll(":scope > .football-kpi")).forEach((card) => decorateCard(card, windowState));\n\n    const summary = byId("football-trend-summary");\n''',
              '''    const windowState = resolveWindow();\n    Array.from(grid.querySelectorAll(":scope > .football-kpi")).forEach((card) => decorateCard(card, windowState));\n    renderBettingPerformance(windowState);\n\n    const summary = byId("football-trend-summary");\n''',
              "render period betting stats",
          )

          old_style = '''      .football-trend-panel {\n        display: grid;\n        gap: 1rem;\n        margin: 1.2rem 0;\n        padding: 1rem;\n        border: 1px solid rgba(176, 145, 255, 0.3);\n        border-radius: 18px;\n        background: linear-gradient(145deg, rgba(24, 20, 66, 0.72), rgba(9, 8, 34, 0.82));\n      }\n      .football-trend-heading { display: grid; gap: 0.35rem; }\n      .football-trend-heading h3,\n      .football-trend-heading p { margin: 0; }\n      .football-trend-heading p { max-width: 920px; font-size: 0.86rem; line-height: 1.6; opacity: 0.76; }\n'''
          new_style = '''      .football-trend-panel {\n        margin: 1.2rem 0;\n        border: 1px solid rgba(176, 145, 255, 0.3);\n        border-radius: 18px;\n        background: linear-gradient(145deg, rgba(24, 20, 66, 0.72), rgba(9, 8, 34, 0.82));\n        overflow: hidden;\n      }\n      .football-trend-panel > summary { list-style: none; cursor: pointer; user-select: none; }\n      .football-trend-panel > summary::-webkit-details-marker { display: none; }\n      .football-trend-heading {\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        gap: 1rem;\n        padding: 1rem;\n      }\n      .football-trend-heading-copy { display: grid; gap: 0.35rem; min-width: 0; }\n      .football-trend-heading h3,\n      .football-trend-heading p { margin: 0; }\n      .football-trend-heading p { max-width: 920px; font-size: 0.86rem; line-height: 1.6; opacity: 0.76; }\n      .football-trend-toggle {\n        flex: 0 0 auto;\n        padding: .4rem .72rem;\n        border: 1px solid rgba(176, 145, 255, 0.28);\n        border-radius: 999px;\n        background: rgba(142, 125, 255, 0.1);\n        font-size: .78rem;\n        white-space: nowrap;\n      }\n      .football-trend-body { display: grid; gap: 1rem; padding: 0 1rem 1rem; }\n      .football-trend-betting-block { display: grid; gap: .7rem; }\n      .football-trend-betting-heading { display: grid; gap: .22rem; }\n      .football-trend-betting-heading h4,\n      .football-trend-betting-heading p { margin: 0; }\n      .football-trend-betting-heading p { font-size: .78rem; line-height: 1.5; opacity: .72; }\n      .football-trend-betting-grid {\n        display: grid;\n        grid-template-columns: repeat(3, minmax(0, 1fr));\n        gap: .7rem;\n      }\n      .football-trend-betting-card {\n        display: grid;\n        gap: .28rem;\n        padding: .78rem .82rem;\n        border: 1px solid rgba(142, 125, 255, .25);\n        border-radius: 14px;\n        background: rgba(16, 12, 47, .42);\n      }\n      .football-trend-betting-card small { opacity: .74; }\n      .football-trend-betting-card strong { font-size: 1.08rem; }\n      .football-trend-betting-card span { font-size: .76rem; line-height: 1.45; opacity: .82; }\n'''
          text = replace_once(text, old_style, new_style, "performance details styles")
          text = replace_once(
              text,
              '''      @media (max-width: 980px) {\n        .football-trend-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n      }\n      @media (max-width: 620px) {\n        .football-trend-controls { grid-template-columns: 1fr; }\n      }\n''',
              '''      @media (max-width: 980px) {\n        .football-trend-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n        .football-trend-betting-grid { grid-template-columns: 1fr; }\n      }\n      @media (max-width: 620px) {\n        .football-trend-heading { display: grid; align-items: stretch; }\n        .football-trend-toggle { justify-self: start; }\n        .football-trend-controls { grid-template-columns: 1fr; }\n      }\n''',
              "performance responsive styles",
          )
          old_panel = '''    const panel = createElement("section", "football-trend-panel");\n    panel.id = "football-performance-observer";\n\n    const heading = createElement("div", "football-trend-heading");\n    heading.append(\n      createElement("h3", "", "滾動績效觀察"),\n      createElement("p", "", "可依單日、日期區間、截至日期、最近已核對場次或最近天數回看。此處只比較時間與樣本，不使用程式修改、模型版本或權重調整日期作為切點。")\n    );\n'''
          new_panel = '''    const parent = grid.parentElement;\n    if (!parent) return;\n    const panel = createElement("details", "football-trend-panel football-stats-subsection");\n    panel.id = "football-performance-observer";\n\n    const heading = createElement("summary", "football-trend-heading");\n    const headingCopy = createElement("div", "football-trend-heading-copy");\n    headingCopy.append(\n      createElement("h3", "", "滾動績效觀察"),\n      createElement("p", "", "可依單日、日期區間、截至日期、最近已核對場次或最近天數回看；同一區間也會累計運彩總成本、總損益與 ROI。")\n    );\n    const toggle = createElement("span", "football-trend-toggle", "展開");\n    heading.append(headingCopy, toggle);\n'''
          text = replace_once(text, old_panel, new_panel, "performance details heading")
          text = replace_once(
              text,
              '''    const summary = createElement("p", "football-trend-summary");\n    summary.id = "football-trend-summary";\n    panel.append(heading, controls, summary);\n    grid.insertAdjacentElement("beforebegin", panel);\n\n    controls.addEventListener("change", () => {\n''',
              '''    const summary = createElement("p", "football-trend-summary");\n    summary.id = "football-trend-summary";\n    const body = createElement("div", "football-trend-body");\n    body.id = "football-performance-body";\n\n    parent.insertBefore(panel, grid);\n    body.append(controls, summary, grid);\n    panel.append(heading, body);\n    panel.addEventListener("toggle", () => {\n      toggle.textContent = panel.open ? "收合" : "展開";\n    });\n    ensureBettingPerformanceSummary();\n\n    controls.addEventListener("change", () => {\n''',
              "performance details body",
          )
          path.write_text(text, encoding="utf-8")

          # 4) Source comparison: own <details>, and outer accordion must preserve nested performance/KPI ownership.
          path = Path("src/football/source-comparison-metrics.js")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "// - ensureStatsAccordion：時間／空間 O(1)，固定建立單一收合容器。",
              "// - ensureStatsAccordion：時間／空間 O(1)，固定建立外層收合與維持子區塊位置。",
              1,
          )
          text = replace_once(
              text,
              '''    .football-stats-accordion-content {\n      display: grid;\n      gap: 1rem;\n      margin-top: .85rem;\n    }\n''',
              '''    .football-stats-accordion-content {\n      display: grid;\n      gap: 1rem;\n      margin-top: .85rem;\n    }\n\n    .football-source-comparison { overflow: hidden; }\n    .football-source-comparison > summary {\n      list-style: none;\n      cursor: pointer;\n      user-select: none;\n    }\n    .football-source-comparison > summary::-webkit-details-marker { display: none; }\n    .football-source-comparison[open] > summary { margin-bottom: .9rem; }\n    .football-source-toggle {\n      flex: 0 0 auto;\n      padding: .4rem .72rem;\n      border: 1px solid rgba(142, 125, 255, .28);\n      border-radius: 999px;\n      background: rgba(142, 125, 255, .1);\n      font-size: .78rem;\n      white-space: nowrap;\n    }\n''',
              "source subsection styles",
          )
          old_move = '''  if (kpis.parentElement !== content) {\n    content.appendChild(kpis);\n  }\n\n  const comparison = byId("football-source-comparison");\n  if (comparison && comparison.parentElement !== content) {\n    content.insertBefore(comparison, kpis);\n  }\n\n  keepOperationalPanelsVisible(details);\n'''
          new_move = '''  const performance = byId("football-performance-observer");\n  if (performance) {\n    if (performance.parentElement !== content) content.appendChild(performance);\n  } else if (kpis.parentElement !== content) {\n    content.appendChild(kpis);\n  }\n\n  const comparison = byId("football-source-comparison");\n  if (comparison && comparison.parentElement !== content) {\n    content.insertBefore(comparison, performance || content.firstChild);\n  }\n\n  keepOperationalPanelsVisible(details);\n'''
          text = replace_once(text, old_move, new_move, "outer accordion nested ownership")

          helper = '''\n/** 來源比較子區塊切換文案：時間／空間 O(1)。 */\nfunction updateSourceDetailsLabel(panel) {\n  const toggle = panel?.querySelector(".football-source-toggle");\n  if (toggle) toggle.textContent = panel.open ? "收合" : "展開";\n}\n\n/**\n * 將舊 section 相容轉成獨立 details；只在首次遇到舊節點時搬一次。\n * 時間複雜度：O(1)；空間複雜度：O(1)。\n * 更快替代方案比較：每次 render 重建整個面板會遺失使用者展開狀態；\n * 本版只做一次節點型別遷移，後續 replaceChildren 不改 details.open。\n */\nfunction ensureSourceComparisonDetails(kpis) {\n  let panel = byId("football-source-comparison");\n  if (panel && panel.tagName !== "DETAILS") {\n    const migrated = document.createElement("details");\n    migrated.id = panel.id;\n    migrated.className = panel.className;\n    panel.parentElement?.replaceChild(migrated, panel);\n    panel = migrated;\n  }\n\n  if (!panel) {\n    panel = document.createElement("details");\n    panel.id = "football-source-comparison";\n    panel.className = "football-panel football-source-comparison football-stats-subsection";\n    const content = byId(STATS_ACCORDION_CONTENT_ID);\n    const performance = byId("football-performance-observer");\n    if (content) content.insertBefore(panel, performance || content.firstChild);\n    else kpis?.parentElement?.insertBefore(panel, kpis);\n  }\n\n  if (!panel.dataset.toggleBound) {\n    panel.dataset.toggleBound = "true";\n    panel.addEventListener("toggle", () => updateSourceDetailsLabel(panel));\n  }\n  return panel;\n}\n\n'''
          anchor = "/**\n * 以現行單張能量欄位重畫固定 6 張摘要卡。\n"
          text = replace_once(text, anchor, helper + anchor, "source details helper")
          text = replace_once(
              text,
              '''    let panel = byId("football-source-comparison");\n    if (!panel) {\n      panel = document.createElement("section");\n      panel.id = "football-source-comparison";\n      panel.className = "football-panel football-source-comparison";\n      kpis.parentElement.insertBefore(panel, kpis);\n    }\n\n''',
              '''    const panel = ensureSourceComparisonDetails(kpis);\n    if (!panel) return;\n\n''',
              "source panel details creation",
          )
          text = replace_once(
              text,
              '    const heading = document.createElement("div");\n    heading.className = "football-source-heading";\n',
              '    const heading = document.createElement("summary");\n    heading.className = "football-source-heading";\n',
              "source summary element",
          )
          text = replace_once(
              text,
              '''    badge.className = "football-version";\n    badge.textContent = `${summary.completedPairs} 場已核對`;\n    heading.append(copy, badge);\n''',
              '''    badge.className = "football-version";\n    badge.textContent = `${summary.completedPairs} 場已核對`;\n    const toggle = document.createElement("span");\n    toggle.className = "football-source-toggle";\n    heading.append(copy, badge, toggle);\n''',
              "source details toggle",
          )
          text = replace_once(
              text,
