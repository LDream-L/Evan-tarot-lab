name: One-time exact title migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-exact-tarot-sports-title.yml"

permissions:
  contents: write

jobs:
  patch-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact 塔羅X賽事驗證 naming
        shell: python
        run: |
          from pathlib import Path

          exact_files = [
              Path("src/football/source-comparison-runtime.js"),
              Path("JS/football-lab.js"),
              Path("tests/e2e/site.spec.js"),
          ]
          for path in exact_files:
              source = path.read_text(encoding="utf-8")
              source = source.replace("塔羅 X 賽事驗證", "塔羅X賽事驗證")
              path.write_text(source, encoding="utf-8")

          football = Path("football-lab.html")
          source = football.read_text(encoding="utf-8")
          replacements = {
              "<title>Evan Tarot｜世足賽事驗證 v1.7.6</title>":
                  "<title>Evan Tarot｜塔羅X賽事驗證｜介面 v1.8.0</title>",
              "← 塔羅實驗室 / 實驗物件":
                  "← 塔羅實驗室 / 塔羅X賽事驗證",
              "<h1>世足賽事驗證 v1.7.6。</h1>":
                  "<h1>塔羅X賽事驗證。</h1>",
              "單張牌與四張攻防分開判讀；結果獨立呈現，攻防則依主攻對客防、客攻對主防排列。":
                  "目前先以足球驗證：同一場賽事分別保存自己抽牌與網站隨機抽牌，賽後比較兩者準確率。",
              "aria-label=\"世足驗證原則\"":
                  "aria-label=\"塔羅賽事驗證原則\"",
              "模型 v1.6.0｜介面 v1.7.6":
                  "模型 v1.6.0｜介面 v1.8.0",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Expected football page text not found: {old}")
              source = source.replace(old, new, 1)
          source = source.replace("世足賽事驗證", "塔羅X賽事驗證")
          football.write_text(source, encoding="utf-8")

          lab = Path("lab.html")
          if lab.exists():
              source = lab.read_text(encoding="utf-8")
              source = source.replace("世足賽事驗證", "塔羅X賽事驗證")
              lab.write_text(source, encoding="utf-8")

      - name: Commit exact title
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-lab.html lab.html JS/football-lab.js src/football/source-comparison-runtime.js tests/e2e/site.spec.js
          git commit -m "feat: use exact 塔羅X賽事驗證 title"
          git push origin HEAD:main
