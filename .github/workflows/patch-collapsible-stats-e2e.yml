name: One-time collapsed statistics test alignment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-collapsible-stats-e2e.yml"

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align site E2E expectation
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/e2e/site.spec.js")
          source = path.read_text(encoding="utf-8")
          old = '''  await expect(page.locator("#football-source-comparison")).toBeVisible();'''
          new = '''  await expect(page.locator("#football-stats-accordion")).toBeVisible();
          await expect(page.locator("#football-stats-accordion")).not.toHaveAttribute("open", "");
          await expect(page.locator("#football-source-comparison")).toHaveCount(1);'''
          if old not in source:
              raise SystemExit("Expected source comparison visibility assertion not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Commit test alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/site.spec.js
          git commit -m "test: expect collapsed validation statistics"
          git push origin HEAD:main
