name: One-time iPad layout v2 cache hotfix

on:
  push:
    paths:
      - .github/workflows/hotfix-ipad-layout-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh football page cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('football-lab.html')
          text = path.read_text(encoding='utf-8')
          old = 'JS/football-lab.js?v=20260807-field-context-v2'
          new = 'JS/football-lab.js?v=20260808-ipad-layout-v2'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('football-lab cache key not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit HTML cache key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-lab.html
          git commit -m "build: refresh football page cache for iPad v2"
          git push origin main
