name: Diagnose Google auth E2E

on:
  push:
    paths:
      - .github/workflows/diagnose-auth-e2e.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full browser regression
        id: browser_test
        shell: bash
        run: |
          set +e
          npx playwright test --reporter=line > /tmp/full-e2e.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save concise diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo "exit_code=${{ steps.browser_test.outputs.exit_code }}"
            echo "--- failure summary / tail ---"
            tail -n 320 /tmp/full-e2e.log
          } > diagnostics/full-e2e.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/full-e2e.txt
          git commit -m "test: capture full browser diagnostic"
          git push origin main
