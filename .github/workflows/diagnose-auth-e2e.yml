name: Diagnose Google auth E2E

on:
  push:
    paths:
      - .github/workflows/diagnose-auth-e2e.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run auth regression only
        id: auth_test
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/site.spec.js --grep "Google 舊工作階段驗證慢時仍可直接重新登入" --project=desktop-chromium --reporter=line > /tmp/auth-e2e.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save concise diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo "exit_code=${{ steps.auth_test.outputs.exit_code }}"
            echo "--- tail ---"
            tail -n 120 /tmp/auth-e2e.log
          } > diagnostics/auth-e2e.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/auth-e2e.txt
          git commit -m "test: capture Google auth e2e diagnostic"
          git push origin main
