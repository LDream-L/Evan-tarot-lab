name: Build Devil Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/article-media/devil-jpg-upload/**'
      - '.github/workflows/rebuild-devil-hq.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode JPG
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='assets/article-media/tarot-devil-xv-hq.jpg'
          cat \
            assets/article-media/devil-jpg-upload/chunk_00.txt \
            assets/article-media/devil-jpg-upload/chunk_01.txt \
            assets/article-media/devil-jpg-upload/chunk_02.txt \
            assets/article-media/devil-jpg-upload/chunk_03.txt \
            | tr -d '\n\r\t ' \
            | base64 --decode > "$OUTPUT"

          test "$(stat -c%s "$OUTPUT")" -gt 100000
          test "$(xxd -p -l 3 "$OUTPUT")" = 'ffd8ff'
          test "$(tail -c 2 "$OUTPUT" | xxd -p)" = 'ffd9'
          file "$OUTPUT" | grep -q 'JPEG image data'

      - name: Commit JPG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/article-media/tarot-devil-xv-hq.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'asset: add direct Devil HQ JPG'
          git push
