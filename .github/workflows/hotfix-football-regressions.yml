name: One-time football regression fixes

on:
  push:
    paths:
      - .github/workflows/hotfix-football-regressions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply regression patch
        run: python scripts/one-time-football-regression-patch.py
      - name: Run static and build checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/football/betting-runtime.js
          node --check src/football/workflow-runtime.js
          node --check JS/google-auth.js
          npm install --no-audit --no-fund
          npm run test:build
          node tests/football-betting-model.test.cjs
          node tests/football-bundle.test.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run affected browser regressions
        run: npx playwright test tests/e2e/football-betting.spec.js tests/e2e/football-ipad-layout.spec.js tests/e2e/football-kpi-density.spec.js tests/e2e/site.spec.js --grep "運彩投注綁定牌源|football lab stays inside iPad|滾動績效 KPI|Google 舊工作階段驗證慢時仍可直接重新登入" --reporter=line
      - name: Commit regression fixes and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-football-regression-patch.py
          git rm -f .github/workflows/diagnose-auth-e2e.yml diagnostics/auth-e2e.txt diagnostics/full-e2e.txt
          git add src/football/betting-runtime.js src/football/workflow-runtime.js JS/football-lab.js football-lab.html tests/football-bundle.test.cjs tests/e2e/football-ipad-layout.spec.js tests/e2e/football-kpi-density.spec.js *.html
          git commit -m "fix: restore betting editor and align nested stats regressions"
          git push origin main
