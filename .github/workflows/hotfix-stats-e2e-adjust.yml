name: One-time nested stats e2e adjustment

on:
  push:
    paths:
      - .github/workflows/hotfix-stats-e2e-adjust.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply e2e expectation updates
        run: python scripts/one-time-adjust-stats-e2e.py
      - name: Commit test updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-adjust-stats-e2e.py
          git add tests/e2e/football-performance-clarity.spec.js tests/e2e/football-kpi-density.spec.js tests/e2e/source-comparison.spec.js
          git commit -m "test: open nested football stat sections"
          git push origin main
