name: Export Devil Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild JPG
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='assets/article-media/tarot-devil-xv-hq.jpg'
          : > "$OUTPUT"

          for CHUNK in \
            assets/article-media/devil-jpg-upload/chunk_00.txt \
            assets/article-media/devil-jpg-upload/chunk_01.txt \
            assets/article-media/devil-jpg-upload/chunk_02.txt \
            assets/article-media/devil-jpg-upload/chunk_03.txt
          do
            tr -d '\n\r\t ' < "$CHUNK" | base64 --decode >> "$OUTPUT"
          done

          echo "size=$(stat -c%s "$OUTPUT")"
          echo "sha256=$(sha256sum "$OUTPUT" | awk '{print $1}')"
          echo "header=$(xxd -p -l 3 "$OUTPUT")"
          echo "footer=$(tail -c 2 "$OUTPUT" | xxd -p)"
          file "$OUTPUT"

      - name: Upload rebuilt JPG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devil-hq-jpg
          path: assets/article-media/tarot-devil-xv-hq.jpg
          if-no-files-found: error
          retention-days: 1
