name: Export Devil Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build decoding candidates
        shell: bash
        run: |
          mkdir -p devil-candidates
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re
          import traceback

          out = Path('devil-candidates')
          report = []
          paths = [
              Path('assets/article-media/devil-jpg-upload/chunk_00.txt'),
              Path('assets/article-media/devil-jpg-upload/chunk_01.txt'),
              Path('assets/article-media/devil-jpg-upload/chunk_02.txt'),
              Path('assets/article-media/devil-jpg-upload/chunk_03.txt'),
          ]

          parts = []
          for path in paths:
              raw = path.read_text(encoding='utf-8', errors='replace')
              clean = ''.join(re.findall(r'[A-Za-z0-9+/=]', raw))
              parts.append(clean)
              invalid = sorted(set(re.sub(r'[A-Za-z0-9+/=\s]', '', raw)))
              report.append(
                  f'{path}: raw={len(raw)} clean={len(clean)} '
                  f'equals={clean.count("=")} first_eq={clean.find("=")} '
                  f'last16={clean[-16:]} invalid={repr("".join(invalid))}'
              )

          def write_candidate(name, producer):
              try:
                  data = producer()
                  (out / name).write_bytes(data)
                  report.append(
                      f'{name}: size={len(data)} sha256={hashlib.sha256(data).hexdigest()} '
                      f'head={data[:3].hex()} tail={data[-2:].hex()}'
                  )
              except Exception as error:
                  report.append(f'{name}: ERROR {type(error).__name__}: {error}')
                  report.append(traceback.format_exc())

          joined = ''.join(parts)
          write_candidate('candidate-joined.jpg', lambda: base64.b64decode(joined, validate=False))

          joined_without_internal_padding = ''.join(part.rstrip('=') for part in parts)
          joined_without_internal_padding += '=' * ((4 - len(joined_without_internal_padding) % 4) % 4)
          write_candidate(
              'candidate-joined-no-internal-padding.jpg',
              lambda: base64.b64decode(joined_without_internal_padding, validate=False),
          )

          decoded_parts = []
          for index, part in enumerate(parts):
              padded = part + ('=' * ((4 - len(part) % 4) % 4))
              try:
                  decoded = base64.b64decode(padded, validate=False)
              except Exception as error:
                  report.append(f'part-{index:02d}: ERROR {type(error).__name__}: {error}')
                  decoded = b''
              decoded_parts.append(decoded)
              (out / f'part-{index:02d}.bin').write_bytes(decoded)
              report.append(
                  f'part-{index:02d}: size={len(decoded)} sha256={hashlib.sha256(decoded).hexdigest()} '
                  f'head={decoded[:3].hex()} tail={decoded[-2:].hex()}'
              )

          write_candidate('candidate-parts.jpg', lambda: b''.join(decoded_parts))
          (out / 'report.txt').write_text('\n'.join(report), encoding='utf-8')
          print('\n'.join(report))
          PY

          file devil-candidates/* || true
          exit 0

      - name: Upload candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devil-decoding-candidates
          path: devil-candidates
          if-no-files-found: error
          retention-days: 1
