name: Export Devil Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify JPG
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='assets/article-media/tarot-devil-xv-hq.jpg'
          cat \
            assets/article-media/devil-jpg-upload/chunk_00.txt \
            assets/article-media/devil-jpg-upload/chunk_01.txt \
            assets/article-media/devil-jpg-upload/chunk_02.txt \
            assets/article-media/devil-jpg-upload/chunk_03.txt \
            | tr -d '\n\r\t ' \
            | base64 --decode > "$OUTPUT"

          test "$(stat -c%s "$OUTPUT")" = '293528'
          test "$(sha256sum "$OUTPUT" | awk '{print $1}')" = 'aceb31abded3fcbaf2693d8f9d730bebc4a1d711b42f0b99a0b394cd30ae23cb'
          test "$(xxd -p -l 3 "$OUTPUT")" = 'ffd8ff'
          test "$(tail -c 2 "$OUTPUT" | xxd -p)" = 'ffd9'
          file "$OUTPUT" | grep -q 'JPEG image data'

      - name: Upload verified JPG
        uses: actions/upload-artifact@v4
        with:
          name: devil-hq-jpg
          path: assets/article-media/tarot-devil-xv-hq.jpg
          if-no-files-found: error
          retention-days: 1
