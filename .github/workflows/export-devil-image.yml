name: Export Devil Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect current complete image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p devil-export
          cp assets/article-media/tarot-devil-xv.jpg devil-export/tarot-devil-xv.jpg
          {
            echo "size=$(stat -c%s devil-export/tarot-devil-xv.jpg)"
            echo "sha256=$(sha256sum devil-export/tarot-devil-xv.jpg | awk '{print $1}')"
            echo "header=$(od -An -tx1 -N3 devil-export/tarot-devil-xv.jpg | tr -d ' \n')"
            echo "footer=$(tail -c 2 devil-export/tarot-devil-xv.jpg | od -An -tx1 | tr -d ' \n')"
            file devil-export/tarot-devil-xv.jpg
          } | tee devil-export/report.txt

      - name: Upload complete image
        uses: actions/upload-artifact@v4
        with:
          name: devil-complete-fallback
          path: devil-export
          if-no-files-found: error
          retention-days: 1
