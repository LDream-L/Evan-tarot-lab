name: Diagnose live auth backend

on:
  push:
    paths:
      - .github/workflows/diagnose-live-auth-backend.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Apps Script GET
        shell: bash
        run: |
          set +e
          url='https://script.google.com/macros/s/AKfycbzswz6AgA2DnXKNVwfSgCHBUwgiqZCT6w8McUVw8EOCBxvnPb2--SxAZJelKsakdbrv/exec'
          echo '=== GET ==='
          curl -L --max-time 20 --connect-timeout 8 -sS -D /tmp/get.headers -o /tmp/get.body -w 'http=%{http_code} total=%{time_total}s redirect=%{time_redirect}s final=%{url_effective}\n' "$url"
          code=$?
          echo "curl_exit=$code"
          sed -n '1,40p' /tmp/get.headers || true
          echo '--- body ---'
          head -c 1200 /tmp/get.body || true
          echo
      - name: Probe Apps Script authStatus POST
        shell: bash
        run: |
          set +e
          url='https://script.google.com/macros/s/AKfycbzswz6AgA2DnXKNVwfSgCHBUwgiqZCT6w8McUVw8EOCBxvnPb2--SxAZJelKsakdbrv/exec'
          payload='{"action":"authStatus","credential":"header.eyJzdWIiOiJkaWFnbm9zdGljIiwiZXhwIjo0MTAyNDQ0ODAwfQ.signature","requestId":"github_diagnostic","website":""}'
          echo '=== POST authStatus ==='
          curl -L --max-time 20 --connect-timeout 8 -sS -D /tmp/post.headers -o /tmp/post.body -w 'http=%{http_code} total=%{time_total}s redirect=%{time_redirect}s final=%{url_effective}\n' -H 'Content-Type: text/plain;charset=UTF-8' --data "$payload" "$url"
          code=$?
          echo "curl_exit=$code"
          sed -n '1,60p' /tmp/post.headers || true
          echo '--- body ---'
          head -c 1800 /tmp/post.body || true
          echo
