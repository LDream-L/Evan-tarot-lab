name: Bootstrap readable timeflow source

on:
  push:
    branches:
      - refactor/timeflow-readable-source-20260710

permissions:
  contents: write

jobs:
  format-source:
    if: ${{ !contains(github.event.head_commit.message, '[source-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: refactor/timeflow-readable-source-20260710
          fetch-depth: 0

      - name: Generate readable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/timeflow

          npx --yes prettier@3.6.2 JS/timeflow-v5-ui.js --parser babel > src/timeflow/ui.js
          npx --yes prettier@3.6.2 JS/timeflow-v5-actions.js --parser babel > src/timeflow/actions.js
          npx --yes prettier@3.6.2 JS/divination-map.js --parser babel > src/timeflow/bootstrap.js

          python3 - <<'PY'
          from pathlib import Path

          headers = {
              "ui.js": """/**\n * 主題時間流 v5｜可閱讀 UI 原始碼\n *\n * 主要流程：render／畫布／側欄／時間順序清單。\n * 時間複雜度：O(N log N + L log L)；空間複雜度：O(N + L)。\n *\n * 替代方案比較：\n * - 單行壓縮檔：瀏覽器載入較小，但無法有效審查與維護。\n * - 本檔：保留完全相同行為與符號，只做結構化格式化，作為後續命名重構的正式 source。\n */\n""",
              "actions.js": """/**\n * 主題時間流 v5｜可閱讀操作原始碼\n *\n * 主要流程：新增、編輯、刪除、復原、連結、匯出與互動事件。\n * 各操作依既有 Map／Set 索引執行；批次刪除只走必要資料集合。\n *\n * 替代方案比較：\n * - 直接維護單行執行檔：差異難以檢查，錯誤風險高。\n * - 本檔：先以無行為變更的格式化建立可審查基線，再逐步改善命名。\n */\n""",
              "bootstrap.js": """/**\n * 主題時間流 v5｜可閱讀啟動原始碼\n *\n * 主要流程：取得 DOM 參照、初始化狀態、串接 UI／Actions／Cloud。\n * 時間／空間複雜度：O(1)（不含資料載入與各模組自身初始化）。\n *\n * 替代方案比較：\n * - 將啟動流程藏在單行壓縮碼中：載入快但無法安全修改。\n * - 本檔：保留原行為並提供可閱讀入口，正式執行檔由建置流程產生。\n */\n""",
          }

          for name, header in headers.items():
              path = Path("src/timeflow") / name
              body = path.read_text(encoding="utf-8")
              path.write_text(header + body, encoding="utf-8")
          PY

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/timeflow

          if git diff --cached --quiet; then
            echo "Readable source already up to date."
            exit 0
          fi

          git commit -m "refactor: 產生可閱讀時間流 source [source-generated]"
          git push origin HEAD:refactor/timeflow-readable-source-20260710
