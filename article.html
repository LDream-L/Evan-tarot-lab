  <link rel="stylesheet" href="article-content.css?v=20260629-structured-content-v1" />

</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-main">Evan Tarot</span>
        <span class="logo-sub">Tarot Lab ／ Systematic Divination</span>
      </div>
      <nav class="nav" aria-label="主選單">
        <a href="index.html#intro">介紹</a>
        <a href="services.html">占卜項目</a>
        <a href="articles.html" aria-current="page">文章</a>
        <a href="lab.html">實驗室</a>
        <a href="timeflow.html">時間流</a>
        <a data-podcast-link="true" href="https://podcasts.apple.com/tw/podcast/%E6%9C%89%E9%BB%9E%E5%81%8F/id1896598359" target="_blank" rel="noopener noreferrer" aria-label="前往 Apple Podcast 收聽《有點偏》（另開新分頁）">Podcast</a>
        <a href="services.html#booking">預約</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section article-detail-section">
      <div class="container article-detail-container">
        <a class="article-back-link" href="articles.html">← 回文章總覽</a>
        <article class="article-detail-card" id="article-detail" aria-live="polite">
          <p class="article-loading">文章載入中…</p>
        </article>

        <section class="comments-block article-thread-block" id="article-discussion" aria-labelledby="discussion-title">
          <div class="article-thread-heading">
            <div>
              <p class="article-thread-kicker">Discussion</p>
              <h2 id="discussion-title">留言討論</h2>
              <p class="comments-note">登入 Google 帳號並設定公開暱稱後，即可留言或回覆。</p>
            </div>
            <span class="article-comment-count" id="comment-count">0 則留言</span>
          </div>

          <p class="comment-login-required" id="comment-login-required">請從右上角登入 Google 帳號，登入後才可設定暱稱並留言。</p>
          <form class="comment-form article-main-comment-form is-auth-locked" id="comment-form">
            <label>
              留言內容
              <textarea id="comment-text" rows="4" maxlength="1000" required disabled placeholder="登入並設定暱稱後即可留言。"></textarea>
            </label>
            <button class="btn primary full" type="submit" disabled>送出留言</button>
            <p class="tool-feedback-message hidden" id="comment-message" aria-live="polite"></p>
          </form>
          <div class="comment-list article-thread-list" id="comment-list" aria-live="polite"></div>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Evan Tarot ｜塔羅記事與文章</p>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client?hl=zh-TW" async defer></script>
  <script src="JS/utils.js?v=20260629-stability-v1"></script>

  <script src="JS/article-comments.js?v=20260629-stability-v1"></script>
  <script src="JS/copy-cleanup.js?v=20260624-copy-cleanup-v1"></script>
  <script src="JS/article-media-library.js?v=20260715-cloud-media-v1"></script>
  <script src="JS/article-detail.js?v=20260715-media-ready-v1"></script>
  <script src="JS/article-media-refresh.js?v=20260715-media-ready-v1"></script>
  <script src="JS/ripple-effect.js?v=20260505-polish-v2"></script>
  <script src="JS/main.js?v=20260812-auth-resilience-v3"></script>
</body>
</html>
